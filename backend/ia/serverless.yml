service: becas-rol3-ia-resiliencia

frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  # AWS Academy no permite crear roles IAM nuevos (iam:CreateRole denegado).
  # Usamos el rol "LabRole" que AWS Academy ya provisiona por defecto en
  # cada cuenta de estudiante, con los permisos necesarios para Lambda/SQS/etc.
  # Esta cuenta (247169770475) es la del Rol 2, donde tambien vive la cola SQS.
  iam:
    role: arn:aws:iam::247169770475:role/LabRole
  environment:
    # OpenAI es el proveedor activo. Groq queda disponible como alternativa
    # compatible mediante las mismas interfaces de aplicación.
    LLM_PROVIDER: ${env:LLM_PROVIDER, 'openai'}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-4o-mini'}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    GROQ_MODEL: ${env:GROQ_MODEL, 'llama-3.3-70b-versatile'}
    FIRESTORE_COLLECTION: evaluaciones
    # El JSON completo de la cuenta de servicio de Firebase, como string.
    # En tu .env local va en una sola linea. NUNCA se sube a git (ver .gitignore).
    FIREBASE_CREDENTIALS_JSON: ${env:FIREBASE_CREDENTIALS_JSON}

functions:
  evaluarPostulacion:
    handler: src/handlers/evaluarPostulacion.handler
    timeout: 45
    # Limita cuantas invocaciones concurrentes de ESTA funcion puede haber
    # a la vez. Es el control real de presión contra el rate limit del LLM:
    # aunque lleguen 100 mensajes a la cola, como maximo 5 lotes se procesan
    # en paralelo, evitando saturar la API y disparar 429 en cascada.
    reservedConcurrency: 5
    events:
      - sqs:
          # ARN real de la cola SQS creada y administrada por el Rol 2
          arn: arn:aws:sqs:us-east-1:247169770475:becas-ingesta-queue
          batchSize: 25            # dentro del rango 20-30 pedido por el reto
          # Para cargas pequeñas priorizamos respuesta rápida: Lambda se invoca
          # apenas haya mensajes, sin añadir una espera artificial de 5 segundos.
          maximumBatchingWindow: 0
          # Fija la concurrencia maxima del propio trigger (ademas del
          # reservedConcurrency de la funcion), para que un futuro deploy
          # siempre la deje en 5 sin depender de ajustes manuales en consola.
          maximumConcurrency: 5
          # Permite reportar fallos POR MENSAJE individual en vez de fallar
          # el lote completo. Es la pieza clave para que el reintento de
          # SQS no reprocese mensajes que ya se guardaron bien en Firestore.
          functionResponseType: ReportBatchItemFailures

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

package:
  patterns:
    - '!.env'
    - '!test-local.js'
    - '!MANUAL_ROL3.md'
