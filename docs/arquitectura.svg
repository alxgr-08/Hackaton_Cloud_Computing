<svg width="680" height="870" viewBox="0 0 680 870" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagrama de arquitectura basada en eventos del sistema Selecta">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="870" fill="#FFFFFF"/>

  <text x="36" y="42" font-size="20" font-weight="700" fill="#16181D">Arquitectura basada en eventos</text>
  <text x="36" y="63" font-size="12.5" fill="#6B6F76">Selecta — selección de becas asíncrona, serverless y orientada a eventos</text>

  <!-- Zonas (relleno tenue) -->
  <rect x="128" y="232" width="504" height="372" rx="12" fill="#EEF0FE"/>
  <text x="142" y="251" font-size="11.5" font-weight="600" fill="#1B2A8C">AWS · us-east-1</text>
  <rect x="128" y="612" width="504" height="56" rx="12" fill="#E9F5EF"/>
  <text x="142" y="631" font-size="11.5" font-weight="600" fill="#0E5236">Firebase</text>

  <!-- Retorno en tiempo real (Firestore -> Frontend) -->
  <path d="M225 641 L96 641 L96 174 L222 174" fill="none" stroke="#1F8A5B" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="104" y="139" font-size="11" fill="#1F8A5B">onSnapshot · tiempo real</text>

  <!-- Reintento (Lambda IA -> SQS) -->
  <path d="M225 508 L192 508 L192 432 L222 432" fill="none" stroke="#C2422D" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="187" y="476" font-size="10.5" fill="#C2422D" text-anchor="end">reintento</text>

  <!-- Usuario -->
  <rect x="250" y="84" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="330" y="107" font-size="13" font-weight="600" fill="#3A3A37" text-anchor="middle">Comité de becas</text>
  <line x1="330" y1="120" x2="330" y2="146" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Frontend -->
  <rect x="225" y="148" width="210" height="52" rx="8" fill="#E7F4EE" stroke="#1F8A5B" stroke-width="1"/>
  <text x="330" y="170" font-size="13.5" font-weight="600" fill="#0E5236" text-anchor="middle">Frontend · React</text>
  <text x="330" y="187" font-size="11" fill="#0E5236" text-anchor="middle">Firebase Hosting · URL pública</text>
  <line x1="330" y1="200" x2="330" y2="256" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="227" font-size="11" fill="#5F5E5A">POST · array de postulantes</text>

  <!-- API Gateway -->
  <rect x="225" y="258" width="210" height="44" rx="8" fill="#EAEDFE" stroke="#2742E8" stroke-width="1"/>
  <text x="330" y="279" font-size="13.5" font-weight="600" fill="#1B2A8C" text-anchor="middle">Amazon API Gateway</text>
  <text x="330" y="294" font-size="11" fill="#1B2A8C" text-anchor="middle">/upload  (POST)</text>
  <line x1="330" y1="302" x2="330" y2="322" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Lambda Ingesta -->
  <rect x="225" y="324" width="210" height="56" rx="8" fill="#EAEDFE" stroke="#2742E8" stroke-width="1"/>
  <text x="330" y="345" font-size="13.5" font-weight="600" fill="#1B2A8C" text-anchor="middle">Lambda · Ingesta (Python)</text>
  <text x="330" y="363" font-size="11" fill="#1B2A8C" text-anchor="middle">valida array · máx 50 · normaliza</text>
  <line x1="330" y1="380" x2="330" y2="404" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="396" font-size="11" fill="#5F5E5A">1 msg / postulante</text>

  <!-- SQS -->
  <rect x="225" y="406" width="210" height="46" rx="8" fill="#EAEDFE" stroke="#2742E8" stroke-width="1"/>
  <text x="330" y="427" font-size="13.5" font-weight="600" fill="#1B2A8C" text-anchor="middle">Amazon SQS</text>
  <text x="330" y="443" font-size="11" fill="#1B2A8C" text-anchor="middle">becas-ingesta-queue</text>
  <line x1="330" y1="452" x2="330" y2="480" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="344" y="471" font-size="11" fill="#5F5E5A">lote de 25 · concurrencia 5</text>

  <!-- DLQ -->
  <rect x="470" y="406" width="148" height="46" rx="8" fill="#EAEDFE" stroke="#2742E8" stroke-width="1"/>
  <text x="544" y="427" font-size="12.5" font-weight="600" fill="#1B2A8C" text-anchor="middle">Amazon SQS · DLQ</text>
  <text x="544" y="443" font-size="11" fill="#1B2A8C" text-anchor="middle">becas-dlq</text>
  <line x1="435" y1="429" x2="466" y2="429" stroke="#C2422D" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="472" y="400" font-size="10.5" fill="#C2422D">tras 3 intentos</text>

  <!-- Lambda IA -->
  <rect x="225" y="482" width="210" height="66" rx="8" fill="#EAEDFE" stroke="#2742E8" stroke-width="1"/>
  <text x="330" y="503" font-size="13.5" font-weight="600" fill="#1B2A8C" text-anchor="middle">Lambda · IA (Node.js 20)</text>
  <text x="330" y="520" font-size="11" fill="#1B2A8C" text-anchor="middle">batchSize 25 · concurrency 5</text>
  <text x="330" y="535" font-size="11" fill="#1B2A8C" text-anchor="middle">ReportBatchItemFailures</text>
  <line x1="330" y1="548" x2="330" y2="614" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- LLM -->
  <rect x="470" y="488" width="150" height="52" rx="8" fill="#F2ECFB" stroke="#7C5CD6" stroke-width="1"/>
  <text x="545" y="510" font-size="12.5" font-weight="600" fill="#432B86" text-anchor="middle">OpenAI gpt-4o-mini</text>
  <text x="545" y="526" font-size="11" fill="#432B86" text-anchor="middle">activo · Groq opcional</text>
  <line x1="435" y1="503" x2="467" y2="503" stroke="#7C5CD6" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="467" y1="521" x2="435" y2="521" stroke="#7C5CD6" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="476" y="482" font-size="10.5" fill="#432B86">evaluación</text>

  <!-- Firestore -->
  <rect x="225" y="618" width="210" height="46" rx="8" fill="#E7F4EE" stroke="#1F8A5B" stroke-width="1"/>
  <text x="330" y="639" font-size="13.5" font-weight="600" fill="#0E5236" text-anchor="middle">Cloud Firestore</text>
  <text x="330" y="655" font-size="11" fill="#0E5236" text-anchor="middle">colección  evaluaciones</text>

  <!-- Panel de resiliencia -->
  <rect x="36" y="690" width="608" height="112" rx="10" fill="#FAFAF8" stroke="#E4E1DA" stroke-width="1"/>
  <text x="52" y="714" font-size="13" font-weight="700" fill="#16181D">Resiliencia y control de límites del LLM — Criterio 3</text>
  <text x="52" y="737" font-size="11.5" fill="#3A3A37">• Lotes de 25 mensajes (rango 20–30 del reto)</text>
  <text x="52" y="757" font-size="11.5" fill="#3A3A37">• Concurrencia limitada a 5 (presión contra el LLM)</text>
  <text x="52" y="777" font-size="11.5" fill="#3A3A37">• Reintento por mensaje: ReportBatchItemFailures</text>
  <text x="350" y="737" font-size="11.5" fill="#3A3A37">• Fallos persistentes aislados en la DLQ (3 intentos)</text>
  <text x="350" y="757" font-size="11.5" fill="#3A3A37">• Idempotencia: doc id = id_postulante</text>
  <text x="350" y="777" font-size="11.5" fill="#3A3A37">• El cliente solo envía id, promedio, ensayo, logros</text>

  <!-- Leyenda -->
  <rect x="36" y="824" width="13" height="13" rx="3" fill="#EAEDFE" stroke="#2742E8"/>
  <text x="55" y="835" font-size="11.5" fill="#3A3A37">AWS serverless</text>
  <rect x="186" y="824" width="13" height="13" rx="3" fill="#E7F4EE" stroke="#1F8A5B"/>
  <text x="205" y="835" font-size="11.5" fill="#3A3A37">Firebase / GCP</text>
  <rect x="336" y="824" width="13" height="13" rx="3" fill="#F2ECFB" stroke="#7C5CD6"/>
  <text x="355" y="835" font-size="11.5" fill="#3A3A37">LLM externo</text>
  <rect x="476" y="824" width="13" height="13" rx="3" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="495" y="835" font-size="11.5" fill="#3A3A37">Usuario</text>
</svg>
